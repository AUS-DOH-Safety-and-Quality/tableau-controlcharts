name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - run: npm ci
    - run: npm run typecheck
    - run: npx vite build --base "/${{ github.event.repository.name }}/"
    # The manifests users install point at the published site, whose hostname GitHub lowercases
    - env:
        OWNER: ${{ github.repository_owner }}
      run: |
        for chart in spc funnels; do
          sed "s#http://localhost:8765/#https://${OWNER,,}.github.io/${{ github.event.repository.name }}/#" "$chart/$chart.trex" > "dist/$chart/$chart.trex"
        done
    - uses: actions/upload-pages-artifact@v4
      with:
        path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
