name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - run: npm ci
    - run: npm run eslint
    - run: npm run typecheck
    - run: |
        sudo apt-get install -y fonts-liberation
        npx playwright install chromium
        npm run test
